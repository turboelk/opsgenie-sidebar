<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title></title>
    <link rel="stylesheet" href="css/options.css">
</head>
<body>
<form id="options">
    <label for="enabled"></label>
    <input type="checkbox" name="enabled" id="enabled" checked>
    <label for="region">The base URL of your backend</label>
    <input type="text" id="region" required>

    <label for="token"></label>
    <input type="password" id="token" required>
	<label for="email"></label>
	<input type="email" id="email" required>
    <label for="time-interval"></label>
    <input type="number" id="time-interval" min="1000" max="60000" value="5000">
    <button type="submit" id="submit"></button>
    <div id="error"></div>
</form>
<script src="js/lib/browser-polyfill.js" type="module"></script>
<script src="js/options.js" type="module"></script>
</body>
</html>
